<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Conversor de Moedas</title>
</head>

<body>
    <main class="container-principal">
        <h1 class="main-title">Conversor de Moedas</h1>

        <div class="currency-select-container">
            <div class="currency-select-label">
                <label for="select-from" class="label-text">Converter de</label>
                <select id="select-from" class="currency-select-to-convert">
                    <option value="BRL">Real Brasileiro</option>
                    <option value="USD">Dólar Americano</option>
                    <option value="EUR">Euro</option>
                    <option value="GBP">Libra</option>
                </select>
            </div>

            <div class="currency-select-label">
                <label for="select-to" class="label-text">Converter para</label>
                <select id="select-to" class="currency-select">
                    <option value="USD">Dólar Americano</option>
                    <option value="EUR">Euro</option>
                    <option value="GBP">Libra</option>
                    <option value="BRL">Real Brasileiro</option>
                </select>
            </div>
        </div>

        <div class="currency-value-container">
            <div class="currency-value-label">
                <label for="input-val" class="label-text-value">Valor a ser convertido:</label>
                <input id="input-val" type="text" maxlength="19" class="input-currency" placeholder="R$ 0,00">
            </div>
            <button class="btnConvert">Converter</button>
        </div>

        <section class="currency-converted-container">
            <div class="currency-box">
                <img class="currency-logo-convert" src="./assets/Real.png" alt="Moeda-a-converter">
                <p class="currency" id="currency-name-convert">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <div class="container-img-arrow">
                <img class="img-arrow" src="./assets/Arrow4.png" alt="Seta">
            </div>

            <div class="currency-box">
                <img class="currency-logo-converted" src="./assets/Dolar.png" alt="Moeda-convertida">
                <p class="currency" id="currency-name-converted">Dólar Americano</p>
                <p class="currency-value-converted">R$ 0,00</p>
            </div>
        </section>
    </main>
</body>

<script src="./scripts.js"></script>

</html>
